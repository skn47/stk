[package]
name = "stk"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "stk"
path = "src/main.rs"

[lib]
name = "stk"
path = "src/lib.rs"

[dependencies]
libc = "0.2.189"
serde_json = "1.0.151"
signal-hook = "0.4.4"
toml = "1.1.5"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
